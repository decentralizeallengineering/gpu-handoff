[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpu-handoff"
version = "0.1.0"
description = "Hand a PCIe GPU between a libvirt VM (vfio) and the Linux host at runtime."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = []

[project.scripts]
gpu-handoff = "gpu_handoff.cli:main"

[tool.setuptools]
packages = ["gpu_handoff"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
